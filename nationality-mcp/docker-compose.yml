services:
  nationality:
    build: .
    # Or, if you'd rather not build on the NAS, swap `build: .` for a prebuilt
    # image you push to a registry.
    container_name: buildx-nationality
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      PORT: 8787
      # Both optional. Set them in a .env file next to this compose file
      # (see .env.example) — don't commit real values.
      NATIONALIZE_API_KEY: ${NATIONALIZE_API_KEY:-}
      AUTH_TOKEN: ${AUTH_TOKEN:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
